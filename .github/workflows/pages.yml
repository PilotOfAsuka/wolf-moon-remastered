name: Publish Web to GitHub Pages
# Web is the player-facing release; publish updates from main automatically.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Get official Godot 4.7.2 and Web template
        run: |
          curl --fail --location 'https://downloads.godotengine.org/?version=4.7.2&flavor=stable&slug=linux.x86_64.zip&platform=linux.64' --output /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          python3 tools/fetch_web_templates.py
      - name: Export Web
        run: |
          mkdir -p build/web
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path game --editor --import
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path game --export-release Web
          touch build/web/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
